<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZPMedya - Sosyal Medya Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-md p-8 rounded-2xl border border-slate-700/50 shadow-2xl text-center">
        <!-- Rozet -->
        <div class="inline-flex items-center gap-2 bg-purple-500/10 border border-purple-500/30 px-4 py-1.5 rounded-full text-purple-400 text-xs font-semibold tracking-wide mb-6">
            <span>🚀</span> Yeni Nesil Sosyal Medya
        </div>

        <!-- Ana Logo -->
        <h1 class="text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent mb-4 tracking-tight">
            zpmedya.com.tr
        </h1>

        <!-- Açıklama -->
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8">
            Özgürce paylaşım yapabileceğin, yeni insanlarla tanışabileceğin yeni sosyal medya platformumuz çok yakında yayında!
        </p>

        <!-- E-posta Formu -->
        <form onsubmit="handleSubscribe(event)" class="space-y-3">
            <div class="relative">
                <input 
                    type="email" 
                    id="emailInput"
                    placeholder="E-posta adresinizi girin..." 
                    required 
                    class="w-full px-4 py-3.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-200"
                />
            </div>
            <button 
                type="submit" 
                class="w-full py-3.5 px-6 rounded-xl font-semibold text-sm bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white shadow-lg shadow-purple-500/25 active:scale-[0.98] transition-all duration-200"
            >
                Aramıza Katıl
            </button>
        </form>

        <!-- Bildirim Mesajı Kutusu -->
        <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-xs font-medium bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">
            ✨ Erken erişim kaydınız başarıyla alındı!
        </div>

        <!-- Alt Bilgi -->
        <div class="mt-8 pt-6 border-t border-slate-700/50 text-xs text-slate-500">
            &copy; 2026 ZPMedya. Tüm hakları saklıdır.
        </div>
    </div>

    <script>
        function handleSubscribe(e) {
            e.preventDefault();
            const input = document.getElementById('emailInput');
            const message = document.getElementById('statusMessage');
            
            if (input.value) {
                message.classList.remove('hidden');
                input.value = '';
                setTimeout(() => {
                    message.classList.add('hidden');
                }, 4000);
            }
        }
    </script>
</body>
</html>
